<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21ada8">
  <meta name="robots" content="noindex">
  <title>Check in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <!-- The studio's own logo (from rhythmdw.com). If it ever fails to load, the name shows instead. -->
    <img class="logo" src="logo.png" alt="" width="560" height="153" onerror="this.parentNode.classList.add('nologo')">
    <span id="studio"></span>
  </header>
  <main id="app" aria-live="polite">
    <div class="card center"><div class="spinner" aria-hidden="true"></div></div>
  </main>
  <noscript><p class="card">Please turn on JavaScript to check in.</p></noscript>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
