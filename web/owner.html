<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21ada8">
  <meta name="robots" content="noindex">
  <!-- The studio page for admins and teachers. Same rules as the check-in page: itself, the Google Font and the Apps Script API,
       plus Google's "Sign in with Google" button (accounts.google.com/gsi), loaded only when config.js has a googleClientId. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- The link carries its key after the #, which browsers never send anywhere; this keeps it out of other sites' logs too. -->
  <meta name="referrer" content="no-referrer">
  <title>Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The API: the connection is opened while the page loads, not when the first request goes out.
       Apps Script answers from script.google.com, then a redirect to script.googleusercontent.com. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="owner">
  <header class="top">
    <img class="logo" src="logo.png" alt="" width="560" height="153">
    <span id="studio"></span>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-tab="today">Today</button>
    <button type="button" data-tab="students">Students</button>
    <button type="button" data-tab="extras">To sort out <span class="count" id="extras-count" hidden></span></button>
    <button type="button" data-tab="team">Team</button>
  </nav>
  <main id="app" aria-live="polite">
    <div class="card center"><div class="spinner" aria-hidden="true"></div></div>
  </main>
  <noscript><p class="card">Please turn on JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script src="owner.js"></script>
</body>
</html>
